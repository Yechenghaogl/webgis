<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS 应用 - 人口普查地图</title>
    
    <link rel="stylesheet" href="https://js.arcgis.com/4.15/esri/css/main.css">
    <script src="https://js.arcgis.com/4.15/"></script>

    <style>
        /* 全局样式 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /*  页眉区域 */
        #header {
            height: 60px;
            background-color: #245b9e;
            color: white;
            line-height: 60px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        /* 主布局容器 */
        #mainContainer {
            display: flex;
            height: calc(100% - 60px);
        }

        /* 2. 底图库区域 */
        #basemapGallery {
            width: 220px;
            background-color: #f5f5f5;
            border-right: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
        }

        /* 3. 地图区域 */
        #mapView {
            flex: 1;
        }

        /* 微件样式 */
        .esri-scale-bar {
            bottom: 20px !important;
            left: 20px !important;
        }
    </style>
</head>

<body>
    <!-- 1. 页眉 -->
    <div id="header">
        第七次全国人口普查 WebGIS 展示系统
    </div>

    <!-- 主容器 -->
    <div id="mainContainer">
        <!-- 2. 底图库区域 -->
        <div id="basemapGallery"></div>

        <!-- 3. 地图区域 -->
        <div id="mapView"></div>
    </div>

    <script>
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/layers/FeatureLayer",
            "esri/widgets/BasemapGallery",
            "esri/widgets/ScaleBar",
            "esri/widgets/Legend",
            "esri/widgets/Search",
            "esri/widgets/LayerList"
        ], function(
            Map, MapView,
            FeatureLayer,
            BasemapGallery, ScaleBar, Legend, Search, LayerList
        ) {

            
            // 1. 创建地图 & 底图
            
            const map = new Map({
                basemap: "topo"  
            });

            
            // 2. 创建地图视图
            
            const view = new MapView({
                container: "mapView",
                map: map,
                zoom: 4,
                center: [104.0, 35.0] // 中国区域
            });

            
            // 3. 加载两个人口普查要素图层
            
            // 省级图层
            const provincialLayer = new FeatureLayer({
                url: "https://www.geosceneonline.cn/server/rest/services/Hosted/第七次全国人口普查分省/FeatureServer",
                title: "第七次人口普查 - 省级"
            });

            // 市级图层
            const cityLayer = new FeatureLayer({
                url: "https://www.geosceneonline.cn/server/rest/services/Hosted/第七次全国人口普查数据（市级）/FeatureServer",
                title: "第七次人口普查 - 市级"
            });
            
            // 添加到地图
            map.add(provincialLayer);
            map.add(cityLayer);
            
            
            // 4. 添加微件
            
            view.when(() => {
                // 比例尺
                const scaleBar = new ScaleBar({
                    view: view,
                    unit: "metric"
                });
                view.ui.add(scaleBar, "bottom-left");

                // 图例
                const legend = new Legend({
                    view: view
                });
                view.ui.add(legend, "bottom-right");

                // 搜索框
                const search = new Search({
                    view: view
                });
                view.ui.add(search, "top-right");

                // 图层列表
                const layerList = new LayerList({
                    view: view
                });
                view.ui.add(layerList, "top-left");

                // 底图库
                const basemapGallery = new BasemapGallery({
                    view: view,
                    container: "basemapGallery"
                });
            });

        });
    </script>
</body>
</html>
