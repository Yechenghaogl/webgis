<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郑和下西洋 · 海上丝绸之路空间叙事</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* ========== 全局 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --ocean-dark: #0a1628;
  --ocean-mid: #0f1f3a;
  --gold: #c9a96e;
  --gold-light: #e0c88a;
  --red: #c41e3a;
  --red-dark: #8b1a2b;
  --parchment: #f5f0e8;
  --text-dim: #8899aa;
  --panel-bg: rgba(15,25,45,0.94);
  --shadow: 0 4px 30px rgba(0,0,0,0.5);
  --font-title: 'STSong','SimSun','Noto Serif SC','KaiTi',serif;
  --font-body: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
}
html, body { height: 100%; overflow: hidden; background: #000; font-family: var(--font-body); }

/* ========== 地图容器 占75% ========== */
#map-container {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1;
}
#map {
  width: 100%; height: 100%;
}

/* 地图复古滤镜 */
.leaflet-tile { filter: sepia(0.25) saturate(0.7) brightness(0.85) hue-rotate(-5deg); }

/* ========== 标题横幅 ========== */
#title-banner {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 10; text-align: center; pointer-events: none;
  transition: opacity 0.8s;
}
#title-banner h1 {
  font-family: var(--font-title); font-size: 2.4rem; font-weight: 700;
  color: var(--gold); text-shadow: 0 0 40px rgba(201,169,110,0.5), 0 2px 8px rgba(0,0,0,0.8);
  letter-spacing: 0.15em; margin: 0;
}
#title-banner .subtitle {
  font-size: 0.95rem; color: var(--gold-light); letter-spacing: 0.2em;
  text-shadow: 0 0 20px rgba(201,169,110,0.4);
}

/* ========== 故事侧边栏 ========== */
#story-panel {
  position: absolute; top: 0; right: 0; width: 380px; height: 100%;
  background: var(--panel-bg); backdrop-filter: blur(12px);
  border-left: 1px solid rgba(201,169,110,0.25);
  z-index: 5; color: var(--parchment); display: flex;
  flex-direction: column; box-shadow: var(--shadow);
  transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
}
#story-panel.collapsed { transform: translateX(380px); }

#panel-toggle {
  position: absolute; left: -36px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 72px; background: var(--panel-bg);
  border: 1px solid rgba(201,169,110,0.25); border-right: none;
  border-radius: 8px 0 0 8px; color: var(--gold); cursor: pointer;
  font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
  z-index: 6; transition: background 0.3s;
}
#panel-toggle:hover { background: rgba(201,169,110,0.15); }

/* 章节指示器 */
#chapter-indicator {
  padding: 24px 28px 8px;
  display: flex; align-items: center; gap: 12px;
}
.chapter-badge {
  font-family: var(--font-title); font-size: 0.85rem; color: var(--gold);
  border: 1px solid var(--gold); padding: 4px 12px; border-radius: 20px;
  letter-spacing: 0.1em; white-space: nowrap;
}
.chapter-phase {
  font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.15em;
}

/* 故事正文区 */
#story-content {
  flex: 1; overflow-y: auto; padding: 0 28px 20px; scroll-behavior: smooth;
}
#story-content::-webkit-scrollbar { width: 4px; }
#story-content::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.3); border-radius: 2px; }

#story-content h2 {
  font-family: var(--font-title); font-size: 1.6rem; color: var(--gold-light);
  margin-bottom: 6px; letter-spacing: 0.08em;
}
#story-content .event-time {
  font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
#story-content .event-time::before {
  content: ''; display: inline-block; width: 24px; height: 1px;
  background: var(--gold); opacity: 0.5;
}
#story-content .narrative {
  font-size: 0.95rem; line-height: 2; color: #c8d0d8; letter-spacing: 0.03em;
  text-align: justify; margin-bottom: 18px;
}
#story-content .highlight-box {
  background: rgba(201,169,110,0.08); border-left: 3px solid var(--gold);
  padding: 12px 16px; margin: 16px 0; border-radius: 0 6px 6px 0;
  font-size: 0.9rem; color: var(--gold-light); line-height: 1.8;
}
#story-content .stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0;
}
#story-content .stat-item {
  background: rgba(201,169,110,0.06); border: 1px solid rgba(201,169,110,0.15);
  border-radius: 8px; padding: 14px; text-align: center;
}
#story-content .stat-num {
  font-family: var(--font-title); font-size: 1.6rem; color: var(--gold);
  display: block;
}
#story-content .stat-label {
  font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; display: block;
}
/* 插图卡片 */
.illust-card {
  width: 100%; border-radius: 10px; margin: 16px 0; overflow: hidden;
  position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  border: 1px solid rgba(201,169,110,0.15);
  background: linear-gradient(135deg, rgba(201,169,110,0.06), rgba(201,169,110,0.02));
  min-height: 120px;
}
.illust-card img {
  display: block; width: 100%; height: auto; object-fit: cover;
}
.illust-card .img-fallback {
  display: none; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%); font-size: 3rem; color: rgba(201,169,110,0.25);
  pointer-events: none;
}
.illust-card img.error ~ .img-fallback,
.illust-card img[src=""] ~ .img-fallback { display: block; }
.illust-card img.error { display: none; }
.illust-caption {
  text-align: center; font-size: 0.75rem; color: var(--text-dim);
  margin-top: 6px; padding-bottom: 6px; letter-spacing: 0.05em;
}

/* 发现进度 */
#discovery-bar {
  padding: 8px 28px; border-top: 1px solid rgba(201,169,110,0.12);
  display: flex; align-items: center; gap: 10px; font-size: 0.78rem;
  color: var(--text-dim);
}
#discovery-bar .disc-count {
  color: var(--gold-light); font-family: var(--font-title); font-size: 0.9rem;
}
#discovery-bar .disc-dots { display: flex; gap: 4px; margin-left: auto; }
.disc-dot {
  width: 8px; height: 8px; border-radius: 50%; background: rgba(201,169,110,0.2);
  transition: all 0.5s;
}
.disc-dot.found { background: var(--gold); box-shadow: 0 0 6px rgba(201,169,110,0.5); }

/* 缩放提示 */
#zoom-hint {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
  z-index: 8; font-size: 0.82rem; color: var(--gold-light);
  background: rgba(10,22,40,0.85); padding: 8px 20px; border-radius: 20px;
  border: 1px solid rgba(201,169,110,0.3); opacity: 0;
  transition: opacity 0.5s; pointer-events: none;
  letter-spacing: 0.05em; text-align: center;
}
#zoom-hint.visible { opacity: 1; }
#zoom-hint .hint-icon { font-size: 1.1rem; margin-right: 4px; }


/* 可交互图例 */
#legend .legend-row.interactive {
  cursor: pointer; padding: 2px 6px; border-radius: 4px;
  transition: background 0.3s; user-select: none;
}
#legend .legend-row.interactive:hover { background: rgba(201,169,110,0.1); }
#legend .legend-row.interactive.toggled-off { opacity: 0.35; }

/* 已发现标记样式 */
.custom-marker.discovered div {
  box-shadow: 0 0 16px currentColor, 0 0 30px currentColor !important;
}

/* 图例 */
#legend {
  padding: 12px 28px; border-top: 1px solid rgba(201,169,110,0.12);
  font-size: 0.78rem; color: var(--text-dim);
}
#legend .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.legend-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.legend-line {
  width: 20px; height: 2px; flex-shrink: 0; border-radius: 1px;
}

/* ========== 底部导航栏 ========== */
#nav-bar {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; align-items: center; gap: 6px;
  background: var(--panel-bg); backdrop-filter: blur(12px);
  border-radius: 40px; padding: 8px 20px;
  border: 1px solid rgba(201,169,110,0.2); box-shadow: var(--shadow);
}
.nav-dot {
  width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
  background: rgba(201,169,110,0.25); transition: all 0.4s;
  position: relative;
}
.nav-dot:hover { background: rgba(201,169,110,0.5); transform: scale(1.2); }
.nav-dot.active { background: var(--gold); box-shadow: 0 0 14px rgba(201,169,110,0.6); }
.nav-dot .dot-tip {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  font-size: 0.7rem; color: var(--gold); white-space: nowrap;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
  font-family: var(--font-title); letter-spacing: 0.05em;
}
.nav-dot.active .dot-tip, .nav-dot:hover .dot-tip { opacity: 1; }

.nav-sep { width: 1px; height: 16px; background: rgba(201,169,110,0.2); margin: 0 6px; }

.nav-btn {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 1px solid rgba(201,169,110,0.3); background: transparent;
  color: var(--gold); font-size: 1rem; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.3s;
}
.nav-btn:hover { background: rgba(201,169,110,0.15); border-color: var(--gold); }
.nav-btn:active { transform: scale(0.9); }

/* ========== 地图覆盖层 - 当前地名牌 ========== */
#location-label {
  position: absolute; bottom: 145px; left: 50%; transform: translateX(-50%);
  z-index: 8; font-family: var(--font-title); font-size: 1.1rem;
  color: var(--gold-light); text-shadow: 0 0 20px rgba(0,0,0,0.8);
  letter-spacing: 0.12em; opacity: 0; transition: opacity 0.5s;
  pointer-events: none; background: rgba(10,22,40,0.7);
  padding: 6px 18px; border-radius: 20px;
}
#location-label.visible { opacity: 1; }

/* ========== 自定义标记弹出窗口 ========== */
.leaflet-popup-content-wrapper {
  background: var(--panel-bg) !important; backdrop-filter: blur(8px);
  color: var(--parchment) !important; border-radius: 10px !important;
  border: 1px solid rgba(201,169,110,0.3) !important;
  box-shadow: var(--shadow) !important;
}
.leaflet-popup-tip { background: rgba(15,25,45,0.94) !important; }
.leaflet-popup-content { margin: 10px 14px !important; font-size: 0.85rem !important; line-height: 1.6 !important; }
.leaflet-popup-content strong { color: var(--gold); font-family: var(--font-title); }

/* 自定义标记 */
.custom-marker {
  width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 12px currentColor; cursor: pointer; transition: transform 0.3s;
}
.custom-marker:hover { transform: scale(1.6); z-index: 1000 !important; }
.custom-marker.chapter-active {
  animation: marker-pulse 1.5s ease-in-out infinite;
}
@keyframes marker-pulse {
  0%,100% { box-shadow: 0 0 8px currentColor; }
  50% { box-shadow: 0 0 25px currentColor, 0 0 50px currentColor; }
}

/* 地图导航箭头 */
.guide-arrow {
  display: flex !important; align-items: center; justify-content: center;
  font-size: 3rem; font-weight: bold; line-height: 1;
  color: #ffd700;
  text-shadow: 0 0 20px rgba(255,215,0,0.9), 0 0 40px rgba(255,180,0,0.6), 0 2px 6px rgba(0,0,0,0.9);
  animation: arrow-bounce 1s ease-in-out infinite; pointer-events: none;
  background: radial-gradient(circle, rgba(201,169,110,0.25) 0%, transparent 70%);
  border-radius: 50%; width: 60px !important; height: 60px !important;
}
@keyframes arrow-bounce {
  0%,100% { font-size: 3rem; opacity: 0.8; }
  50% { font-size: 3.8rem; opacity: 1; }
}
.guide-label {
  position: absolute; white-space: nowrap;
  font-family: var(--font-title); font-size: 0.78rem; color: var(--gold);
  text-shadow: 0 0 10px rgba(0,0,0,0.9); pointer-events: none;
  animation: label-fade 1.2s ease-in-out infinite;
}
@keyframes label-fade {
  0%,100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  #story-panel { width: 100%; right: -100%; }
  #story-panel.collapsed { transform: translateX(100%); }
  #panel-toggle { left: auto; right: 0; border-radius: 0 8px 8px 0; border: 1px solid rgba(201,169,110,0.25); border-right: 1px solid rgba(201,169,110,0.25); }
  #title-banner h1 { font-size: 1.4rem; }
  #nav-bar { bottom: 16px; padding: 6px 14px; gap: 3px; }
}
</style>
</head>
<body>

<!-- 地图容器 -->
<div id="map-container"><div id="map"></div></div>

<!-- 标题 -->
<div id="title-banner">
  <h1>郑和下西洋</h1>
  <div class="subtitle">海上丝绸之路 · 空间叙事</div>
</div>

<!-- 当前位置标签 -->
<div id="location-label"></div>

<!-- 缩放/探索提示 -->
<div id="zoom-hint"><span class="hint-icon">🔍</span> 放大探索此区域以推进故事</div>

<!-- 故事面板 -->
<div id="story-panel">
  <button id="panel-toggle" title="折叠面板">◀</button>
  <div id="chapter-indicator">
    <span class="chapter-badge" id="chapter-badge">第一章</span>
    <span class="chapter-phase" id="chapter-phase">1405 · 扬帆</span>
  </div>
  <div id="story-content"></div>
  <div id="discovery-bar">
    <span>🗺 航线探索</span>
    <span class="disc-count" id="disc-count">1/4</span>
    <div class="disc-dots">
      <span class="disc-dot found" data-disc="0"></span>
      <span class="disc-dot" data-disc="1"></span>
      <span class="disc-dot" data-disc="2"></span>
      <span class="disc-dot" data-disc="3"></span>
    </div>
  </div>
  <div id="legend">
    <div class="legend-row interactive" data-layer="port"><span class="legend-dot" style="background:#e8c840;"></span> 出发港口 <small style="color:#555">点击切换</small></div>
    <div class="legend-row interactive" data-layer="trade"><span class="legend-dot" style="background:#4da6ff;"></span> 贸易站点 <small style="color:#555">点击切换</small></div>
    <div class="legend-row interactive" data-layer="dest"><span class="legend-dot" style="background:#ff6b6b;"></span> 重要目的地 <small style="color:#555">点击切换</small></div>
    <div class="legend-row interactive" data-layer="phase1"><span class="legend-line" style="background:#e8c840;"></span> 第一~三次航行 <small style="color:#555">点击切换</small></div>
    <div class="legend-row interactive" data-layer="phase2"><span class="legend-line" style="background:#4da6ff;"></span> 第四~六次航行 <small style="color:#555">点击切换</small></div>
    <div class="legend-row interactive" data-layer="phase3"><span class="legend-line" style="background:#ff6b6b;"></span> 第七次航行 <small style="color:#555">点击切换</small></div>
  </div>
</div>

<!-- 底部导航 -->
<div id="nav-bar">
  <button class="nav-btn" id="prev-btn" title="上一章">◀</button>
  <span class="nav-sep"></span>
  <div class="nav-dot active" data-chapter="0"><span class="dot-tip">扬帆起航</span></div>
  <div class="nav-dot" data-chapter="1"><span class="dot-tip">乘风破浪</span></div>
  <div class="nav-dot" data-chapter="2"><span class="dot-tip">远抵非洲</span></div>
  <div class="nav-dot" data-chapter="3"><span class="dot-tip">千古流芳</span></div>
  <span class="nav-sep"></span>
  <button class="nav-btn" id="next-btn" title="下一章">▶</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==================== 地图初始化 ====================
const map = L.map('map', {
  center: [20, 110],
  zoom: 5,
  minZoom: 3,
  maxZoom: 13,
  zoomControl: false,
  attributionControl: false
});

L.control.zoom({ position: 'bottomleft' }).addTo(map);

// 底图图层
const baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 18,
}).addTo(map);

const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16,
});

// 图层切换控件
const layerControl = L.control.layers({
  '古典地图': baseLayer,
  '卫星影像': satelliteLayer
}, {}, { position: 'bottomleft', collapsed: true }).addTo(map);

// ==================== 关键地点坐标 ====================
const LOCATIONS = {
  nanjing:      { lat: 32.06, lng: 118.79, name: '南京·龙江关',     type: 'port',    desc: '大明都城，船队始发地。<br>龙江宝船厂打造了当时世界上最大的木制帆船——宝船，长44丈（约138米），可载千人。' },
  liujiagang:   { lat: 31.56, lng: 121.25, name: '太仓·浏家港',     type: 'port',    desc: '苏州门户，船队集结锚地。<br>数百艘大小船只在此编队，装载丝绸、瓷器、茶叶等货物。' },
  quanzhou:     { lat: 24.91, lng: 118.58, name: '泉州·刺桐港',     type: 'port',    desc: '宋元以来的东方第一大港。<br>大量阿拉伯商人后裔在此担任通译和导航。' },
  champa:       { lat: 13.77, lng: 109.23, name: '占城·新州港',     type: 'trade',   desc: '今越南归仁，船队第一站。<br>盛产优质沉香木和犀角，是南海贸易的重要枢纽。' },
  java:         { lat: -6.80, lng: 112.70, name: '爪哇·杜板',       type: 'trade',   desc: '今印度尼西亚泗水一带。<br>满者伯夷王朝统治中心，胡椒、香料的重要产地。' },
  malacca:      { lat: 2.19,  lng: 102.25, name: '满剌加·马六甲',   type: 'trade',   desc: '郑和扶持建立的苏丹国。<br>扼守马六甲海峡，成为东西方贸易的咽喉枢纽，船队的后勤基地。' },
  sumatra:      { lat: 3.58,  lng: 98.66,  name: '苏门答剌',         type: 'trade',   desc: '今印度尼西亚苏门答腊岛。<br>郑和在此协助平定内乱，维护了航路安全。' },
  ceylon:       { lat: 6.03,  lng: 80.22,  name: '锡兰山·加勒',     type: 'trade',   desc: '今斯里兰卡加勒。<br>佛教圣地，印度洋上的明珠。郑和在此立"布施锡兰山佛寺碑"。' },
  calicut:      { lat: 11.25, lng: 75.77,  name: '古里·科泽科德',   type: 'dest',    desc: '今印度科泽科德，西海岸贸易中心。<br>"胡椒海岸"的核心港口，也是前六次航行最远的目的地。' },
  bengal:       { lat: 22.33, lng: 91.83,  name: '榜葛剌·吉大港',   type: 'trade',   desc: '今孟加拉国吉大港。<br>富庶的孟加拉苏丹国，盛产棉布、宝石。' },
  hormuz:       { lat: 27.10, lng: 56.45,  name: '忽鲁谟斯',         type: 'dest',    desc: '今伊朗霍尔木兹岛。<br>波斯湾口的贸易天堂，"东西方货物的总汇"，宝石、地毯、骏马的集散地。' },
  aden:         { lat: 12.80, lng: 45.03,  name: '阿丹·亚丁',       type: 'dest',    desc: '今也门亚丁。<br>红海入口的千年古港，阿拉伯半岛的香料贸易中心。' },
  mogadishu:    { lat: 2.04,  lng: 45.34,  name: '木骨都束·摩加迪沙', type: 'dest',  desc: '今索马里首都摩加迪沙。<br>东非海岸的重要城邦，郑和船队抵达的最南端非洲城市。' },
  malindi:      { lat: -3.22, lng: 40.12,  name: '麻林·马林迪',     type: 'dest',    desc: '今肯尼亚马林迪。<br>第七次航行的高潮终点！船队以此为最后锚地，随后返航。此地后来也派使臣随船回访中国。' },
  mecca:        { lat: 21.38, lng: 39.85,  name: '天方·麦加',       type: 'dest',    desc: '伊斯兰圣地。<br>据记载，郑和的分遣队可能抵达了麦加，完成了朝圣之旅。' },
};

// ==================== 航线定义（七次远航路线） ====================
const ROUTE_GROUPS = {
  // 第一至三次：南海-印度 (1405-1411)

// ==================== 创建图层组 ====================
const routeLayers = {};
const markerGroups = {};

function createRouteLayer(groupKey, routeDef) {
  const group = L.layerGroup();
  routeDef.routes.forEach(coords => {
    const latlngs = coords.map(c => [c.lat, c.lng]);
    L.polyline(latlngs, {
      color: routeDef.color, weight: routeDef.weight,
      dashArray: routeDef.dashArray, opacity: routeDef.opacity,
      lineCap: 'round', lineJoin: 'round',
    }).addTo(group);
  });
  return group;
}

// 创建所有路线图层
Object.entries(ROUTE_GROUPS).forEach(([key, def]) => {
  routeLayers[key] = createRouteLayer(key, def);
});

// 创建地点标记
function createAllMarkers() {
  const groups = { port: L.layerGroup(), trade: L.layerGroup(), dest: L.layerGroup() };

  const typeColors = { port: '#e8c840', trade: '#4da6ff', dest: '#ff6b6b' };
  const typeIcons = { port: '⚓', trade: '🏴', dest: '★' };

  Object.entries(LOCATIONS).forEach(([key, loc]) => {
    const icon = L.divIcon({
      className: 'custom-marker',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${typeColors[loc.type]};border:2px solid #fff;box-shadow:0 0 10px ${typeColors[loc.type]};"></div>`,
      iconSize: [18, 18], iconAnchor: [9, 9],
    });
    const marker = L.marker([loc.lat, loc.lng], { icon })
      .bindPopup(`<strong>${typeIcons[loc.type]} ${loc.name}</strong><br><small>${loc.desc}</small>`);
    marker._locKey = key;
    marker._locType = loc.type;
    groups[loc.type].addLayer(marker);
  });

  return groups;
}

const allMarkerGroups = createAllMarkers();
Object.entries(allMarkerGroups).forEach(([type, group]) => {
  markerGroups[type] = group;
  group.addTo(map);
});

// ==================== 标记高亮管理 ====================
function highlightMarkers(locKeys) {
  // 清除所有高亮
  Object.values(allMarkerGroups).forEach(group => {
    group.eachLayer(marker => {
      const el = marker.getElement();
      if (el) {
        const inner = el.querySelector('div');
        if (inner) {
          inner.style.transform = 'scale(1)';
          inner.style.animation = '';
        }
      }
    });
  });

  // 高亮当前章节地点
  if (!locKeys) return;
  Object.values(allMarkerGroups).forEach(group => {
    group.eachLayer(marker => {
      if (locKeys.includes(marker._locKey)) {
        const el = marker.getElement();
        if (el) {
          const inner = el.querySelector('div');
          if (inner) {
            inner.style.transform = 'scale(1.8)';
            inner.style.animation = 'marker-pulse 1.5s ease-in-out infinite';
          }
        }
      }
    });
  });
}

// ==================== 切换到章节 ====================
function switchToChapter(chapterId, animate = true) {
  if (isAnimating) return;
  if (chapterId < 0 || chapterId >= chapterData.length) return;

  isAnimating = true;
  currentChapter = chapterId;
  const ch = chapterData[chapterId];

  // 更新导航点
  navDots.forEach((d, i) => d.classList.toggle('active', i === chapterId));

  // 更新面板内容
  chapterBadge.textContent = `第${['一','二','三','四'][chapterId]}章`;
  chapterPhase.textContent = ch.subtitle;
  storyContent.innerHTML = ch.html;
  storyContent.scrollTop = 0;

  // 更新位置标签
  locationLabel.textContent = ch.locationLabel;
  locationLabel.classList.add('visible');
  setTimeout(() => locationLabel.classList.remove('visible'), 4000);

  // 切换路线图层
  ['phase1','phase2','phase3'].forEach(key => {
    if (ch.layersToShow.includes(key)) {
      if (!map.hasLayer(routeLayers[key])) routeLayers[key].addTo(map);
    } else {
      if (map.hasLayer(routeLayers[key])) map.removeLayer(routeLayers[key]);
    }
  });

  // 高亮相关标记
  highlightMarkers(ch.focusLocations);

  // 地图飞行 & 缩放
  if (animate) {
    map.flyTo(ch.center, ch.zoom, {
      duration: 2.5,
      easeLinearity: 0.25,
    });
  } else {
    map.setView(ch.center, ch.zoom);
  }

  // 第三章（远抵非洲）标题淡化为半透明，让地图更加突出
  titleBanner.style.opacity = chapterId === 2 ? '0.4' : '1';

  // 动画完成后解锁 + 刷新箭头
  setTimeout(() => { isAnimating = false; updateGuideArrow(); }, 2600);
}

// ==================== 初始化 ====================
switchToChapter(0, false);

// ==================== 导航事件 ====================
function flashLockedHint() {
  const hint = zoomHint;
  hint.classList.add('visible');
  hint.style.animation = 'none';
  hint.offsetHeight;
  hint.style.animation = '';
  hint.style.borderColor = '#ff6b6b';
  hint.style.boxShadow = '0 0 20px rgba(255,107,107,0.5)';
  setTimeout(() => {
    hint.style.borderColor = '';
    hint.style.boxShadow = '';
    hint.classList.remove('visible');
  }, 2500);
}

prevBtn.addEventListener('click', () => {
  const prev = currentChapter - 1;
  if (prev >= 0 && discoveredChapters.has(prev)) switchToChapter(prev);
  else flashLockedHint();
});
nextBtn.addEventListener('click', () => {
  const next = currentChapter + 1;
  if (next < chapterData.length && discoveredChapters.has(next)) switchToChapter(next);
  else flashLockedHint();
});

// ==================== 键盘导航 ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = currentChapter - 1;
    if (prev >= 0 && discoveredChapters.has(prev)) switchToChapter(prev);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    const next = currentChapter + 1;
    if (next < chapterData.length && discoveredChapters.has(next)) switchToChapter(next);
  } else if (e.key === ' ') {
    e.preventDefault();
    // 空格键保留，可用于其他功能
  }
});

  document.getElementById('disc-count').textContent = `${discoveredChapters.size}/4`;
  document.querySelectorAll('.disc-dot').forEach(dot => {
    const id = parseInt(dot.dataset.disc);
    dot.classList.toggle('found', discoveredChapters.has(id));
  });
}

// ==================== 检查探索触发 ====================
function checkDiscoveryTrigger() {
  const zoom = map.getZoom();
  const center = map.getCenter();

  chapterData.forEach(ch => {
    if (discoveredChapters.has(ch.id)) return;
    // 必须按顺序解锁
    if (ch.id > 0 && !discoveredChapters.has(ch.id - 1)) return;

    const tz = ch.triggerZone;
    let triggered = false;

    if (tz.maxZoom !== undefined) {
      // 缩小到足够小以触发
      if (zoom <= tz.maxZoom) triggered = true;
    } else {
      // 放大到足够大且在区域内
      if (zoom >= tz.minZoom &&
          center.lat >= tz.latMin && center.lat <= tz.latMax &&
          center.lng >= tz.lngMin && center.lng <= tz.lngMax) {
        triggered = true;
      }
    }

    if (triggered) {
      discoveredChapters.add(ch.id);
      updateDiscoveryUI();
      updateGuideArrow();
      switchToChapter(ch.id);
      flashDiscovery(ch.id);
    }
  });

  // 更新缩放提示
  updateZoomHint();
}

// ==================== 缩放提示 ====================
const zoomHint = document.getElementById('zoom-hint');
function updateZoomHint() {
  const zoom = map.getZoom();
  const center = map.getCenter();
  let hint = null;

  // 只提示第一个未发现的章节（按顺序）
  for (const ch of chapterData) {
    if (discoveredChapters.has(ch.id)) continue;
    const tz = ch.triggerZone;
    if (tz.maxZoom !== undefined) {
      if (zoom > tz.maxZoom) hint = `🔍 缩小地图以俯瞰全局，回顾这段伟大航程`;
    } else {
      if (zoom < tz.minZoom - 1) hint = `🔍 请放大地图并前往 <strong>${ch.targetName}</strong> 区域，推进故事`;
      else if (zoom >= tz.minZoom - 1 && zoom < tz.minZoom) hint = `🔍 再放大一点，即将揭开 <strong>${ch.targetName}</strong>`;
      else if (zoom >= tz.minZoom && (center.lat < tz.latMin || center.lat > tz.latMax || center.lng < tz.lngMin || center.lng > tz.lngMax)) {
        hint = `➡ 请将地图移动到 <strong>${ch.targetName}</strong> 区域`;
      }
    }
    break; // 只提示下一个未发现的章节
  }

  if (hint) {
    zoomHint.innerHTML = hint;
    zoomHint.classList.add('visible');
  } else {
    zoomHint.classList.remove('visible');
  }
}

// ==================== 发现闪烁效果 ====================
function flashDiscovery(chapterId) {
  const dot = navDots[chapterId];
  if (!dot) return;
  dot.style.boxShadow = '0 0 20px rgba(201,169,110,0.8), 0 0 40px rgba(201,169,110,0.4)';
  setTimeout(() => { dot.style.boxShadow = ''; }, 2000);
}

// ==================== 地图导航箭头 ====================
let guideArrowMarker = null;

function getArrowChar(bearing) {
  if (bearing < 22.5 || bearing >= 337.5) return '⬆';
  if (bearing >= 22.5 && bearing < 67.5) return '↗';
  if (bearing >= 67.5 && bearing < 112.5) return '➡';
  if (bearing >= 112.5 && bearing < 157.5) return '↘';
  if (bearing >= 157.5 && bearing < 202.5) return '⬇';
  if (bearing >= 202.5 && bearing < 247.5) return '↙';
  if (bearing >= 247.5 && bearing < 292.5) return '⬅';
  return '↖';
}

function updateGuideArrow() {
  if (guideArrowMarker) { map.removeLayer(guideArrowMarker); guideArrowMarker = null; }

  // 找下一个未发现章节
  let nextCh = null;
  for (const ch of chapterData) {
    if (!discoveredChapters.has(ch.id)) { nextCh = ch; break; }
  }
  if (!nextCh) return;

  const center = map.getCenter();
  const tgtLat = nextCh.center[0];
  const tgtLng = nextCh.center[1];

  // 计算方位角
  const dLng = (tgtLng - center.lng) * Math.PI / 180;
  const lat1 = center.lat * Math.PI / 180;
  const lat2 = tgtLat * Math.PI / 180;
  const y = Math.sin(dLng) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
  let bearing = Math.atan2(y, x) * 180 / Math.PI;
  if (bearing < 0) bearing += 360;

  // 箭头始终在用户当前视野中心
  const arrowLat = center.lat;
  const arrowLng = center.lng;

  const arrowChar = getArrowChar(bearing);
  const arrowIcon = L.divIcon({
    className: 'guide-arrow',
    html: arrowChar,
    iconSize: [60, 60], iconAnchor: [30, 30],
  });
  guideArrowMarker = L.marker([arrowLat, arrowLng], {
    icon: arrowIcon, interactive: false, zIndexOffset: 9000,
  }).addTo(map);
}

// ==================== 增强的标记点击 ====================
Object.values(allMarkerGroups).forEach(group => {
  group.eachLayer(marker => {
    marker.on('click', (e) => {
      const locKey = marker._locKey;
      const loc = LOCATIONS[locKey];

      // 记录发现
      if (!discoveredLocations.has(locKey)) {
        discoveredLocations.add(locKey);
        // 在地图上标记为已发现
        const el = marker.getElement();
        if (el) el.classList.add('discovered');
      }

      // 飞行到标记位置并放大
      map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 8), { duration: 1.5 });

      // 显示位置标签
      locationLabel.textContent = '📍 ' + loc.name;
      locationLabel.classList.add('visible');
      setTimeout(() => locationLabel.classList.remove('visible'), 3500);

      // 检查是否应该因点击标记而推进章节
      // 按顺序发现：只处理第一个未发现章节
      for (const ch of chapterData) {
        if (discoveredChapters.has(ch.id)) continue;
        if (ch.focusLocations.includes(locKey)) {
          const tz = ch.triggerZone;
          const zoom = map.getZoom();
          if (!tz.maxZoom && zoom >= tz.minZoom - 1) {
            discoveredChapters.add(ch.id);
            updateDiscoveryUI();
            updateGuideArrow();
            setTimeout(() => switchToChapter(ch.id), 1600);
            flashDiscovery(ch.id);
          }
        }
        break; // 只检查下一个待解锁的章节
      }
    });
  });
});

// ==================== 地图移动监听 - 发现驱动 ====================
map.on('moveend', () => {
  const zoom = map.getZoom();
  const center = map.getCenter();

  checkDiscoveryTrigger();
  updateGuideArrow();

  // 更新导航点提示
  let nearestChapter = null;
  let minDist = Infinity;
  chapterData.forEach((ch, i) => {
    const d = Math.abs(center.lat - ch.center[0]) + Math.abs(center.lng - ch.center[1]);
    const zoomDiff = Math.abs(zoom - ch.zoom);
    const score = d + zoomDiff * 10;
    if (score < minDist) { minDist = score; nearestChapter = i; }
  });
  navDots.forEach((d, i) => {
    const alreadyActive = i === currentChapter;
    d.style.boxShadow = (i === nearestChapter && !alreadyActive)
      ? '0 0 8px rgba(201,169,110,0.4)' : '';
    // 已发现的章节导航点可点击
    d.style.opacity = discoveredChapters.has(i) ? '1' : '0.5';
    d.style.cursor = discoveredChapters.has(i) ? 'pointer' : 'not-allowed';
  });

  // 根据缩放/位置显示位置标签
  if (zoom > 7) {
    let closestLoc = null;
    let closestDist = Infinity;
    Object.entries(LOCATIONS).forEach(([key, loc]) => {
      const dist = Math.abs(center.lat - loc.lat) + Math.abs(center.lng - loc.lng);
      if (dist < closestDist) { closestDist = dist; closestLoc = loc; }
    });
    if (closestDist < 3) {
      locationLabel.textContent = '📍 ' + closestLoc.name;
      locationLabel.classList.add('visible');
      setTimeout(() => locationLabel.classList.remove('visible'), 3000);
    }
  }
});

// ==================== 交互式图例（图层切换） ====================
const legendEl = document.getElementById('legend');
legendEl.addEventListener('click', (e) => {
  const row = e.target.closest('.legend-row.interactive');
  if (!row) return;
  const layerName = row.dataset.layer;

  // 切换标记图层
  if (markerGroups[layerName]) {
    const group = markerGroups[layerName];
    if (map.hasLayer(group)) {
      map.removeLayer(group);
      row.classList.add('toggled-off');
    } else {
      group.addTo(map);
      row.classList.remove('toggled-off');
    }
  }

  // 切换路线图层
  if (routeLayers[layerName]) {
    const group = routeLayers[layerName];
    if (map.hasLayer(group)) {
      map.removeLayer(group);
      row.classList.add('toggled-off');
    } else {
      group.addTo(map);
      row.classList.remove('toggled-off');
    }
  }
});

// ==================== 导航点点击（仅已发现章节可点击） ====================
navDots.forEach(dot => {
  dot.addEventListener('click', () => {
    const ch = parseInt(dot.dataset.chapter);
    if (!discoveredChapters.has(ch)) {
      flashLockedHint();
      return;
    }
    if (ch !== currentChapter) switchToChapter(ch);
  });
});

// ==================== 标记鼠标悬停提示 ====================
Object.values(allMarkerGroups).forEach(group => {
  group.eachLayer(marker => {
    marker.on('mouseover', () => {
      const loc = LOCATIONS[marker._locKey];
      locationLabel.textContent = '📍 ' + loc.name;
      locationLabel.classList.add('visible');
    });
    marker.on('mouseout', () => {
      locationLabel.classList.remove('visible');
    });
  });
});

// ==================== 触摸/滚轮支持 ====================
let touchStartX = 0;
storyContent.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

storyContent.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 80) {
    const nextId = dx < 0 ? currentChapter + 1 : currentChapter - 1;
    if (discoveredChapters.has(nextId)) switchToChapter(nextId);
  }
});

  'color:#c9a96e;');
console.log('%c💡 放大地图到中国沿海 → 发现第一篇章 | 西移印度洋 → 发现第二篇章',
  'color:#8899aa;');
console.log('%c💡 探访非洲东海岸 → 发现第三篇章 | 缩小地图 → 发现最终篇章',
  'color:#8899aa;');
console.log('%c⌨ 已发现章节可用 ← → 方向键切换 | 点击图例切换图层 | 点击标记探索地点',
